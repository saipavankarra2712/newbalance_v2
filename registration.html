<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieLand - Registration</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .registration-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(10, 11, 16, 0.82), rgba(10, 11, 16, 0.9)), url('images/auth_bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 30px 15px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .register-box {
            width: 480px;
            max-width: 95%;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 20px;
            text-align: center;
            margin: auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid #f0e0e5;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-box h1 {
            color: var(--primary-color, #e50914);
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .register-box h2 {
            color: #222222;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .register-box p {
            color: #777777;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .register-box input[type="text"],
        .register-box input[type="email"],
        .register-box input[type="tel"],
        .register-box input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .register-box input:focus {
            border-color: var(--primary-color, #e50914);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
        }

        .gender-box {
            text-align: left;
            margin: 12px 0 8px;
            color: #555555;
            font-size: 14px;
        }

        .gender-box label {
            margin-right: 18px;
            cursor: pointer;
        }

        .gender-box input {
            accent-color: var(--primary-color, #e50914);
        }

        .terms-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0;
            font-size: 12px;
            text-align: left;
            color: #555555;
        }

        .terms-box input {
            accent-color: var(--primary-color, #e50914);
            cursor: pointer;
        }

        .terms-box label {
            cursor: pointer;
        }

        .register-box button {
            width: 100%;
            margin: 12px 0 16px;
            padding: 13px;
            font-size: 15px;
        }

        .account-text {
            font-size: 13px;
            color: #666666;
            margin-top: 10px;
        }

        .account-text a {
            color: var(--primary-color, #e50914);
            text-decoration: none;
            font-weight: 700;
        }

        .account-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            color: var(--primary-color, #e50914);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-home:hover {
            transform: translateX(-3px);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body class="registration-page">

    <div class="register-box">

        <h1>MovieLand!</h1>

        <h2>Create Account</h2>

        <p>Join MovieLand and explore a universe of blockbuster cinema!</p>

        <form action="#" method="post" onsubmit="return validatePassword()">

            <input
                type="text"
                name="fullname"
                placeholder="Enter Your Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter Your Email"
                required
            >

            <input
                type="tel"
                name="phone"
                placeholder="Enter Your Phone Number"
                pattern="[0-9]{10}"
                title="Enter a 10-digit phone number"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create Password (min. 6 characters)"
                minlength="6"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm Password"
                minlength="6"
                required
            >

            <div class="gender-box">
                <span style="font-weight: 600; margin-right: 10px;">Favorite Genre:</span>
                <label><input type="radio" name="fav_genre" value="Action" checked> Action</label>
                <label><input type="radio" name="fav_genre" value="Thriller"> Thriller</label>
                <label><input type="radio" name="fav_genre" value="Romance"> Romance</label>
                <label><input type="radio" name="fav_genre" value="SciFi"> Sci-Fi</label>
            </div>

            <div class="terms-box">

                <input type="checkbox" id="terms" name="terms" required>

                <label for="terms">
                    I agree to MovieLand's Terms & Conditions and Privacy Policy
                </label>

            </div>

            <button type="submit" class="btn">
                Register Now
            </button>

        </form>

        <p class="account-text">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

    <script>
        function validatePassword() {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Password and Confirm Password do not match!");
                return false;
            }

            alert("Registration form submitted successfully! Welcome to MovieLand.");
            window.location.href = "login.html";
            return false;
        }
    </script>

</body>
</html>
